[package]
name = "antigravity_core_mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1"
percent-encoding = "2.3"
schemars = "1.2.1"
rmcp = { version = "1.7.0", features = ["server", "macros"] }
